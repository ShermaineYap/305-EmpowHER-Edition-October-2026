[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takethefloor"
version = "1.0.0"
description = "Meeting equity & leadership coaching: airtime, interruptions, idea credit, hedges — with Gemma."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shermaine Yap Shi Min" }]
dependencies = ["google-genai>=1.0"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "pandas>=2.2", "plotly>=5.24"]

[tool.setuptools]
packages = ["takethefloor"]

[tool.pytest.ini_options]
pythonpath = ["."]
